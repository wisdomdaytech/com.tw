<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" font-family="'Noto Sans TC','PingFang TC',sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<rect width="1000" height="460" fill="#f8fafc"/>
<text x="500" y="45" text-anchor="middle" font-size="28" font-weight="700" fill="#0f172a">AI Agent 自主程度階梯</text>
<g text-anchor="middle">
<rect x="40" y="290" width="210" height="120" rx="14" fill="#dbeafe"/><text x="145" y="330" font-size="20" font-weight="700" fill="#1e3a8a">Lv1 聊天機器人</text><text x="145" y="365" font-size="16" fill="#334155">你問它答</text><text x="145" y="390" font-size="16" fill="#334155">ChatGPT / Claude 對話</text>
<rect x="270" y="230" width="210" height="180" rx="14" fill="#bfdbfe"/><text x="375" y="270" font-size="20" font-weight="700" fill="#1e3a8a">Lv2 弱 Agent</text><text x="375" y="305" font-size="16" fill="#334155">專屬指令 + 知識庫</text><text x="375" y="330" font-size="16" fill="#334155">專案 / GPTs / Gems</text><text x="375" y="365" font-size="16" fill="#334155">只分析、不執行</text>
<rect x="500" y="160" width="210" height="250" rx="14" fill="#fed7aa"/><text x="605" y="200" font-size="20" font-weight="700" fill="#9a3412">Lv3 半自主 Agent</text><text x="605" y="235" font-size="16" fill="#334155">串接工具與 MCP</text><text x="605" y="260" font-size="16" fill="#334155">每步需你批准</text><text x="605" y="295" font-size="16" fill="#334155">Claude Code / Codex</text><text x="605" y="320" font-size="16" fill="#334155">(預設審批模式)</text>
<rect x="730" y="90" width="230" height="320" rx="14" fill="#fb923c"/><text x="845" y="130" font-size="20" font-weight="700" fill="#fff">Lv4 強 Agent</text><text x="845" y="165" font-size="16" fill="#fff">長時間自主運行</text><text x="845" y="190" font-size="16" fill="#fff">主動排程、跨平台</text><text x="845" y="225" font-size="16" fill="#fff">OpenClaw / Hermes</text><text x="845" y="250" font-size="16" fill="#fff">放寬權限的 Code / Codex</text><text x="845" y="300" font-size="16" font-weight="700" fill="#fff">效率最高 ↑ 風險最高</text>
</g>
<text x="500" y="445" text-anchor="middle" font-size="15" fill="#64748b">階梯越高:自主性越強、可代勞範圍越大,但所需的權限控管也越嚴格</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
