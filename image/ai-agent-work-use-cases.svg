<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" font-family="'Noto Sans TC','PingFang TC',sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<rect width="1000" height="480" fill="#fff"/>
<text x="500" y="45" text-anchor="middle" font-size="28" font-weight="700" fill="#0f172a">工作情境怎麼選:弱 Agent 還是強 Agent?</text>
<rect x="40" y="75" width="440" height="50" rx="10" fill="#1d4ed8"/><text x="260" y="108" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">弱 AI Agent(分析、建議)</text>
<rect x="520" y="75" width="440" height="50" rx="10" fill="#c2410c"/><text x="740" y="108" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">強 AI Agent(執行、交付)</text>
<g font-size="18" fill="#0f172a">
<rect x="40" y="135" width="440" height="60" rx="8" fill="#eff6ff"/><text x="60" y="171">股票研究助理:整理財報、新聞、風險</text>
<rect x="40" y="205" width="440" height="60" rx="8" fill="#eff6ff"/><text x="60" y="241">客服知識庫:依 SOP 草擬回覆</text>
<rect x="40" y="275" width="440" height="60" rx="8" fill="#eff6ff"/><text x="60" y="311">行銷文案:依品牌語氣產出初稿</text>
<rect x="40" y="345" width="440" height="60" rx="8" fill="#eff6ff"/><text x="60" y="381">合約審閱:標出條款風險供法務複核</text>
<rect x="520" y="135" width="440" height="60" rx="8" fill="#fff7ed"/><text x="540" y="171">工程:跨檔案重構、修 Bug、跑測試</text>
<rect x="520" y="205" width="440" height="60" rx="8" fill="#fff7ed"/><text x="540" y="241">行政:整理信件、排行程、產出報表</text>
<rect x="520" y="275" width="440" height="60" rx="8" fill="#fff7ed"/><text x="540" y="311">營運:定時巡檢、自動彙整日報</text>
<rect x="520" y="345" width="440" height="60" rx="8" fill="#fff7ed"/><text x="540" y="381">研究:搜尋、比對、直接交付簡報</text>
</g>
<text x="500" y="445" text-anchor="middle" font-size="17" fill="#b91c1c" font-weight="700">原則:涉及金錢、刪除、對外發送,務必保留「人工確認」這一關</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
